    <style id="app-splash-css">
#app-splash{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#551b33;opacity:1;transition:opacity .55s ease,visibility 0s linear .55s}
#app-splash.sp-out{opacity:0;visibility:hidden;pointer-events:none}
#app-splash .sp-stage{display:flex;flex-direction:column;align-items:center;transition:transform .55s ease}
#app-splash.sp-out .sp-stage{transform:scale(1.05)}
#app-splash .sp-mark{position:relative;width:min(58vw,40vh,290px);aspect-ratio:1/1}
#app-splash .sp-lit-wrap{position:absolute;inset:0}
#app-splash .sp-layer{position:absolute;inset:0;width:100%;height:100%;overflow:visible;fill:#fff}
#app-splash .sp-ring{will-change:transform}
/* opacity .01 (not 0) keeps each layer rasterised before the animation starts, so its first frame does not stall */
#app-splash .sp-leaf,#app-splash .sp-heart,#app-splash .sp-brand span{opacity:.01;will-change:transform,opacity}
#app-splash .sp-leaf-top{transform-origin:27.5% 14.2%}
#app-splash .sp-leaf-bottom{transform-origin:78.9% 85.8%}
#app-splash .sp-heart{transform-origin:50.6% 49.7%}
#app-splash .sp-arc{fill:none;stroke:#fff;stroke-width:34;stroke-dasharray:1 1;stroke-dashoffset:.996}
#app-splash .sp-brand{display:flex;flex-direction:column;align-items:center;margin-top:clamp(18px,3.4vh,30px);text-align:center;line-height:1;font-family:Manrope,"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app-splash .sp-brand span{display:block}
#app-splash .sp-meet{font-size:clamp(12px,3.4vw,15px);font-weight:700;color:#e8c9a0;letter-spacing:.21em;text-indent:.21em;margin-bottom:8px}
#app-splash .sp-name{font-size:clamp(24px,7.4vw,32px);font-weight:800;color:#fff7f3;letter-spacing:.07em;text-indent:.07em;white-space:nowrap}
#app-splash .sp-tag{font-size:clamp(8px,2.2vw,10px);font-weight:600;color:#c6a5b0;letter-spacing:.2em;text-indent:.2em;margin-top:14px}
#app-splash.sp-run .sp-leaf-top{animation:sp-leaf-top 1.75s cubic-bezier(.2,.85,.25,1) .15s forwards}
#app-splash.sp-run .sp-leaf-bottom{animation:sp-leaf-bottom 1.75s cubic-bezier(.2,.85,.25,1) .15s forwards}
#app-splash.sp-run .sp-arc{animation:sp-draw 1.1s cubic-bezier(.3,.55,.3,1) 1.25s forwards}
#app-splash.sp-run .sp-heart{animation:sp-heart-in .9s cubic-bezier(.2,.8,.2,1) 1.4s forwards}
#app-splash.sp-run .sp-meet{animation:sp-text-in .8s ease 2s forwards}
#app-splash.sp-run .sp-name{animation:sp-text-in .8s ease 2.15s forwards}
#app-splash.sp-run .sp-tag{animation:sp-text-in .8s ease 2.4s forwards}
@keyframes sp-leaf-top{0%{opacity:.01;transform:translate(-119%,19%) rotate(-720deg) scale(.04)}10%{opacity:1}100%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}}
@keyframes sp-leaf-bottom{0%{opacity:.01;transform:translate(119%,-19%) rotate(720deg) scale(.04)}10%{opacity:1}100%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}}
@keyframes sp-draw{to{stroke-dashoffset:0}}
@keyframes sp-heart-in{0%{opacity:.01;transform:scale(.86)}100%{opacity:1;transform:scale(1)}}
@keyframes sp-text-in{0%{opacity:.01;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){#app-splash .sp-leaf,#app-splash .sp-heart,#app-splash .sp-brand span{animation:none!important;opacity:1;transform:none}#app-splash .sp-arc{animation:none!important;stroke-dashoffset:0}}
</style>
